name: cron-shards
# External multi-shot cron driver.
# Hobby Vercel function timeout = 300s. This workflow calls the FastAPI cron
# endpoints in offset-sliced shots to walk SP500 under that budget.
#
# Endpoint shape (deployed at alpha.bobbyzhong.com, routed to alpha-agent backend):
#   GET /api/cron/slow_daily?limit=N&offset=M  (5 slow signals → daily_signals_slow)
#   GET /api/cron/fast_intraday?limit=N&offset=M (10 signals → daily_signals_fast → picks)
#
# Tuning notes (observed):
# - First-shot cold start adds ~5-10s overhead.
# - Running BOTH endpoints in parallel triggered yfinance/Postgres contention →
#   first shot in each job exceeded 300s (saw curl exit 28 timeout).
# - Fix: sequentialize jobs via `needs:` + lower per-shot limits + sleep 30s
#   between shots so the Vercel function stays warm but uncontended.

on:
  schedule:
    # Daily SP500 slow refresh — 13:30 UTC = 09:30 ET pre-open (weekdays).
    - cron: '30 13 * * 1-5'
    # One complete Top-240 signal run after settled daily prices.  Its final
    # step publishes the immutable recommendation snapshot atomically.
    - cron: '0 23 * * 1-5'
    # Intraday is deliberately narrow: watchlist + top names, twice per day.
    - cron: '30 15,19 * * 1-5'
    # Headline ingest is independent from ranking and runs twice per day.
    - cron: '0 15,19 * * 1-5'
    # News: macro (Truth/Fed/OFAC). Was '*/5 * * * *' 24/7 = 288 triggers/day,
    # 82% of this workflow's entire schedule — it exhausted the Neon free-tier
    # DATA TRANSFER quota on 2026-07-24 and took every DB-touching workflow down
    # with it. The system trades on daily close-to-close signals, so 5-min macro
    # granularity at 03:00 has no decision value. Market-adjacent weekdays only
    # (12-21 UTC = 08:00-17:00 ET covers pre-market through post-close).
    - cron: '0 12,16,20 * * 1-5'
    # News: Fed + OFAC hourly, 24/7
    # Off-hours backstop: Fed/OFAC headlines do land overnight and on weekends,
    # so keep a sparse 24/7 sweep rather than going fully dark. 4/day, not 24.
    - cron: '0 2 * * *'
    # Minute bars are an event-study aid, not a full-market critical feed.
    - cron: '15 18 * * 1-5'
    # IC backtest monthly, 1st of month 04:00 UTC
    - cron: '0 4 1 * *'
    # Self-loop daily: append today's daily_prices (forward-return source)
    # then run the walk-forward IC backtest so signal_ic_history +
    # signal_weight_current stay current. 22:00 UTC is after the US close in
    # both DST regimes (20:00/21:00 UTC), so the day's close is settled, and
    # it sits outside the 14-20 UTC intraday window so it does not contend
    # with the fast_intraday jobs for yfinance. Weekdays only.
    - cron: '0 22 * * 1-5'
    # NOTE: news_llm_enrich cron removed 2026-05-17. BYOK architecture
    # means cron has no user-context to source an LLM key. Enrichment
    # moved to read-time path triggered by user with their own key.
    # Research proposal generation is non-critical and weekly, not daily.
    - cron: '30 22 * * 1'
    # L2 runs only after the 23:00 complete signal run and atomic publish.
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'fast_tech'
        type: choice
        options:
          - slow_daily
          - fast_intraday
          - fast_tech
          - fast_mid
          - fast_slow
          - both
          - news_per_ticker
          - news_macro
          - minute_bars_puller
          - ic_backtest_monthly
          - daily_prices_puller
          - methodology_proposer
          - l2_cycle
      request_id:
        description: 'Correlation id supplied by the in-app refresh dispatcher'
        required: false
        type: string

env:
  # Call FastAPI directly to avoid a needless Next.js invocation per shard.
  BACKEND_BASE: https://alpha-api.bobbyzhong.com
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  # fast_intraday runs first when both are dispatched, so picks-page data
  # (the user-visible product surface) gets refreshed before the bulk slow
  # refresh tail. Each is independent at the data layer.
  fast_intraday:
    if: |
      github.event.schedule == '0 23 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'fast_intraday' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Top-240 fast refresh (6 shots × limit=40)
        # 10 signals/ticker × ~3.8s observed → 40 tickers ≈ 152s + cold start.
        # 6 shots × (152s + 30s sleep) = 18min wall, covers offset 0..240.
        run: |
          set -e
          TOTAL_WRITTEN=0
          TOTAL_ERRORS=0
          for offset in 0 40 80 120 160 200; do
            echo "::group::fast shot offset=$offset limit=40"
            T0=$(date +%s)
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/fast_intraday?limit=40&offset=$offset&run_key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$offset")
            DUR=$(( $(date +%s) - T0 ))
            echo "HTTP=$HTTP duration=${DUR}s"
            cat /tmp/shot.json | head -c 800
            echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::fast shot offset=$offset returned HTTP $HTTP after ${DUR}s"
              exit 1
            fi
            WRITTEN=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('rows_written',0))")
            ERRORS=$(python3 -c "import json; print(len(json.load(open('/tmp/shot.json')).get('errors',[])))")
            TOTAL_WRITTEN=$((TOTAL_WRITTEN + WRITTEN))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            echo "::endgroup::"
            sleep 30
          done
          echo "## fast_intraday summary" >> $GITHUB_STEP_SUMMARY
          echo "- rows_written total: $TOTAL_WRITTEN" >> $GITHUB_STEP_SUMMARY
          echo "- errors total: $TOTAL_ERRORS" >> $GITHUB_STEP_SUMMARY
      - name: Publish one immutable recommendation snapshot
        run: |
          PUBLISH_REQUEST_ID="${{ inputs.request_id || github.run_id }}"
          HTTP=$(curl -s --max-time 290 -o /tmp/publish.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_BASE/api/cron/publish_recommendation?request_id=$PUBLISH_REQUEST_ID")
          cat /tmp/publish.json | head -c 800; echo
          [ "$HTTP" = "200" ] || exit 1
          python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/publish.json')).get('ok') else 1)"

  # ─── Tier: technicals only, every 15min, all 557 + watchlist ───────────
  fast_tech:
    if: |
      github.event.schedule == '30 15,19 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'fast_tech')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Tech-only refresh for watchlist + top 40
        run: |
          set -e
          TOTAL_WRITTEN=0
          TOTAL_ERRORS=0
          for offset in 0; do
            echo "::group::tech shot offset=$offset limit=40"
            T0=$(date +%s)
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/fast_intraday?tier=tech&limit=40&offset=$offset&run_key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$offset")
            DUR=$(( $(date +%s) - T0 ))
            echo "HTTP=$HTTP duration=${DUR}s"
            cat /tmp/shot.json | head -c 800
            echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::tech shot offset=$offset returned HTTP $HTTP after ${DUR}s"
              exit 1
            fi
            WRITTEN=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('rows_written',0))")
            ERRORS=$(python3 -c "import json; print(len(json.load(open('/tmp/shot.json')).get('errors',[])))")
            TOTAL_WRITTEN=$((TOTAL_WRITTEN + WRITTEN))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            echo "::endgroup::"
            sleep 10
          done
          echo "## fast_tech summary" >> $GITHUB_STEP_SUMMARY
          echo "- rows_written total: $TOTAL_WRITTEN" >> $GITHUB_STEP_SUMMARY
          echo "- errors total: $TOTAL_ERRORS" >> $GITHUB_STEP_SUMMARY

  # ─── Tier: options + analyst + premarket, hourly at :05 ─────────────────
  fast_mid:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.job == 'fast_mid')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mid-tier refresh (15 shots × limit=40)
        # 3 modules/ticker × ~3s observed → 40 tickers ≈ 120s + cold start.
        # 15 shots × (135s + 15s sleep) ≈ 37min wall, covers offset 0..600.
        run: |
          set -e
          TOTAL_WRITTEN=0
          TOTAL_ERRORS=0
          for offset in 0 40 80 120 160 200 240 280 320 360 400 440 480 520 560; do
            echo "::group::mid shot offset=$offset limit=40"
            T0=$(date +%s)
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/fast_intraday?tier=mid&limit=40&offset=$offset")
            DUR=$(( $(date +%s) - T0 ))
            echo "HTTP=$HTTP duration=${DUR}s"
            cat /tmp/shot.json | head -c 800
            echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::mid shot offset=$offset returned HTTP $HTTP after ${DUR}s"
              exit 1
            fi
            WRITTEN=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('rows_written',0))")
            ERRORS=$(python3 -c "import json; print(len(json.load(open('/tmp/shot.json')).get('errors',[])))")
            TOTAL_WRITTEN=$((TOTAL_WRITTEN + WRITTEN))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            echo "::endgroup::"
            sleep 15
          done
          echo "## fast_mid summary" >> $GITHUB_STEP_SUMMARY
          echo "- rows_written total: $TOTAL_WRITTEN" >> $GITHUB_STEP_SUMMARY
          echo "- errors total: $TOTAL_ERRORS" >> $GITHUB_STEP_SUMMARY

  # ─── Tier: news + insider, every 4h at :10 ──────────────────────────────
  fast_slow:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.job == 'fast_slow')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Slow-tier refresh (10 shots × limit=60)
        # 2 modules/ticker × ~2s observed → 60 tickers ≈ 120s + cold start.
        # 10 shots × (135s + 15s sleep) ≈ 25min wall, covers offset 0..600.
        run: |
          set -e
          TOTAL_WRITTEN=0
          TOTAL_ERRORS=0
          for offset in 0 60 120 180 240 300 360 420 480 540; do
            echo "::group::slow-tier shot offset=$offset limit=60"
            T0=$(date +%s)
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/fast_intraday?tier=slow&limit=60&offset=$offset")
            DUR=$(( $(date +%s) - T0 ))
            echo "HTTP=$HTTP duration=${DUR}s"
            cat /tmp/shot.json | head -c 800
            echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::slow-tier shot offset=$offset returned HTTP $HTTP after ${DUR}s"
              exit 1
            fi
            WRITTEN=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('rows_written',0))")
            ERRORS=$(python3 -c "import json; print(len(json.load(open('/tmp/shot.json')).get('errors',[])))")
            TOTAL_WRITTEN=$((TOTAL_WRITTEN + WRITTEN))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            echo "::endgroup::"
            sleep 15
          done
          echo "## fast_slow summary" >> $GITHUB_STEP_SUMMARY
          echo "- rows_written total: $TOTAL_WRITTEN" >> $GITHUB_STEP_SUMMARY
          echo "- errors total: $TOTAL_ERRORS" >> $GITHUB_STEP_SUMMARY

  slow_daily:
    # `needs` + `always()` lets slow_daily run after fast_intraday when both are
    # dispatched (sequential), while still triggering on its own schedule when
    # fast_intraday is skipped.
    needs: [fast_intraday]
    if: |
      always() && (
        github.event.schedule == '30 13 * * 1-5' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.job == 'slow_daily' || inputs.job == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SP500 slow refresh (7 shots × limit=80)
        # 5 signals/ticker × ~1.5s observed → 80 tickers ≈ 120s + cold start.
        # 7 shots × (120s + 30s sleep) = 17min wall, covers offset 0..560 = full SP500.
        run: |
          set -e
          TOTAL_WRITTEN=0
          TOTAL_ERRORS=0
          for offset in 0 80 160 240 320 400 480; do
            echo "::group::slow shot offset=$offset limit=80"
            T0=$(date +%s)
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/slow_daily?limit=80&offset=$offset")
            DUR=$(( $(date +%s) - T0 ))
            echo "HTTP=$HTTP duration=${DUR}s"
            cat /tmp/shot.json | head -c 800
            echo
            if [ "$HTTP" != "200" ]; then
              echo "::error::slow shot offset=$offset returned HTTP $HTTP after ${DUR}s"
              exit 1
            fi
            WRITTEN=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('rows_written',0))")
            ERRORS=$(python3 -c "import json; print(len(json.load(open('/tmp/shot.json')).get('errors',[])))")
            TOTAL_WRITTEN=$((TOTAL_WRITTEN + WRITTEN))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            echo "::endgroup::"
            sleep 30
          done
          echo "## slow_daily summary" >> $GITHUB_STEP_SUMMARY
          echo "- rows_written total: $TOTAL_WRITTEN" >> $GITHUB_STEP_SUMMARY
          echo "- errors total: $TOTAL_ERRORS" >> $GITHUB_STEP_SUMMARY

      - name: Recompute IC change annotations (traceability)
        # Keep the /evolution chart's change markers current after the daily
        # signal refresh. Non-fatal: the annotation overlay is a nice-to-have,
        # so a hiccup here must not fail the whole slow_daily job (no email).
        run: |
          HTTP=$(curl -s --max-time 120 \
            -o /tmp/ann.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_BASE/api/cron/compute_ic_annotations?window_days=30" || echo "000")
          echo "HTTP=$HTTP"; head -c 400 /tmp/ann.json; echo
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ic annotations recompute returned HTTP $HTTP (non-fatal)"
          fi

  news_per_ticker:
    if: |
      github.event.schedule == '0 15,19 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'news_per_ticker')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: news per-ticker, top 150 in two shots
        run: |
          set -e
          for offset in 0 75; do
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/news_per_ticker?limit=75&offset=$offset")
            echo "offset=$offset HTTP=$HTTP"
            cat /tmp/shot.json | head -c 400; echo
            [ "$HTTP" = "200" ] || exit 1
            sleep 10
          done

  news_macro:
    if: |
      github.event.schedule == '0 12,16,20 * * 1-5' ||
      github.event.schedule == '0 2 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'news_macro')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: news macro single shot
        run: |
          HTTP=$(curl -s --max-time 60 -o /tmp/shot.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_BASE/api/cron/news_macro")
          cat /tmp/shot.json | head -c 400; echo
          [ "$HTTP" = "200" ] || exit 1

  l2_cycle:
    if: |
      github.event.schedule == '45 23 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'l2_cycle')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: advance L2 paper book one step
        run: |
          HTTP=$(curl -s --max-time 120 \
            -o /tmp/shot.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BACKEND_BASE/api/cron/l2_cycle")
          cat /tmp/shot.json | head -c 400; echo
          [ "$HTTP" = "200" ] || exit 1

  minute_bars_puller:
    if: |
      github.event.schedule == '15 18 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'minute_bars_puller')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: pull minute bars for event candidates (top 75)
        run: |
          set -e
          for offset in 0; do
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/minute_bars?limit=75&offset=$offset")
            echo "offset=$offset HTTP=$HTTP"
            cat /tmp/shot.json | head -c 200; echo
            [ "$HTTP" = "200" ] || exit 1
            sleep 10
          done

  ic_backtest_monthly:
    if: |
      github.event.schedule == '0 4 1 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'ic_backtest_monthly')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: monthly walk-forward IC backtest
        run: |
          HTTP=$(curl -s --max-time 600 -o /tmp/shot.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST "$BACKEND_BASE/api/cron/ic_backtest_monthly")
          cat /tmp/shot.json | head -c 400; echo
          [ "$HTTP" = "200" ] || exit 1

  # ─── Self-loop daily: daily_prices append + walk-forward IC backtest ────
  # Phase 1a forward-return foundation. Appends today's close for all 557
  # tickers into daily_prices (the IC engine's forward-return source), then
  # runs the IC backtest so signal_ic_history + signal_weight_current stay
  # current (the run has a skip-recent-1hr guard, so a daily cadence on top
  # of the monthly job is safe and idempotent).
  daily_prices_puller:
    if: |
      github.event.schedule == '0 22 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'daily_prices_puller')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: append today's daily_prices (8 shots × limit=75)
        run: |
          set -e
          TOTAL_UPDATED=0
          TOTAL_ERRORS=0
          for offset in 0 75 150 225 300 375 450 525; do
            echo "::group::daily_prices shot offset=$offset limit=75"
            HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_BASE/api/cron/daily_prices?limit=75&offset=$offset")
            echo "offset=$offset HTTP=$HTTP"
            cat /tmp/shot.json | head -c 600; echo
            [ "$HTTP" = "200" ] || exit 1
            UPDATED=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('updated',0))")
            ERRORS=$(python3 -c "import json; print(json.load(open('/tmp/shot.json')).get('error_count',0))")
            TOTAL_UPDATED=$((TOTAL_UPDATED + UPDATED))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))
            echo "::endgroup::"
            sleep 10
          done
          echo "## daily_prices summary" >> $GITHUB_STEP_SUMMARY
          echo "- updated total: $TOTAL_UPDATED" >> $GITHUB_STEP_SUMMARY
          echo "- errors total: $TOTAL_ERRORS" >> $GITHUB_STEP_SUMMARY
      - name: run walk-forward IC backtest (populate IC history + weights)
        run: |
          HTTP=$(curl -s --max-time 600 -o /tmp/ic.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST "$BACKEND_BASE/api/cron/ic_backtest_monthly")
          cat /tmp/ic.json | head -c 400; echo
          [ "$HTTP" = "200" ] || exit 1

  methodology_proposer:
    if: |
      github.event.schedule == '30 22 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'methodology_proposer')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: run Phase 2a methodology proposer (single shot)
        run: |
          HTTP=$(curl -s --max-time 290 -o /tmp/shot.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST "$BACKEND_BASE/api/cron/methodology_proposer")
          cat /tmp/shot.json | head -c 400; echo
          [ "$HTTP" = "200" ] || exit 1

# news_llm_enrich job removed 2026-05-17 (BYOK architecture - enrich
# moved to read-time path triggered by user with their own LLM key).
