name: paper-bot-runner

on:
  workflow_dispatch:
    inputs:
      bot_operation:
        type: choice
        default: run
        options: [run, market_probe, valuation_refresh]
      probe_ticker:
        description: Symbol for read-only market_probe (ignored by other operations)
        type: string
        default: SPY
  # Backup clock removed: Vercel drives the bot (GET /api/cron/paper_bot/drive).

permissions:
  contents: read
concurrency:
  group: paper-bot-runner
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/cron-preflight.yml
    with:
      trigger_event: ${{ github.event_name }}
    secrets:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
  drain:
    needs: [preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded paper bot stages
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BOT_SCHEDULE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          BOT_CRON_EXPRESSION: ${{ github.event.schedule }}
          BOT_OPERATION: ${{ inputs.bot_operation || 'run' }}
          BOT_PROBE_TICKER: ${{ inputs.probe_ticker || 'SPY' }}
        run: python3 scripts/run_paper_bot_worker.py
